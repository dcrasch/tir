[package]
name = "tir-web"
version = "0.2.0"
authors = ["David Rasch"]
license= "GPL-3.0"
edition = "2021"
repository = "https://github.com/dcrasch/tir"
description = "Tessellation for the web"

[dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2.82"
serde_json = "1.0"
tessellations = { path = "../tessellations" }
euclid = "0.22"

[dependencies.web-sys]
version = "0.3.55"
features = [
  'CanvasRenderingContext2d',
  'ImageData',
  'CssStyleDeclaration',
  'Document',
  'Element',
  'Event',
  'EventTarget',
  'HtmlCanvasElement',
  'HtmlElement',
  'HtmlOptionElement',
  'HtmlSelectElement',
  'KeyboardEvent',
  'Location',
  'MouseEvent',
  'TouchEvent',
  'Node',
  'Window'
]
