[package]
name = "tessellations"
version = "0.3.1"
authors = ["David Rasch"]
license= "GPL-3.0"
edition = "2021"
repository = "https://github.com/dcrasch/tir"
keywords = ["tessellation", "graphics","tiling"]
description = "Library to create and draw periodic tilings of the plane."
documentation = "https://docs.rs/tessellations/"

[lib]
name="tessellations"

[dependencies]
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
svg = "0.13"
lyon = "1.0"
serde = { version="1.0.104", features = ["derive"] }
euclid = "0.22"
palette = "0.7"

[dev-dependencies]
serde_json = "1.0.48"
