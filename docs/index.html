<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Tessellations</title>
    <base href="/tir/" />
    <style>
      :root { color-scheme: light; }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        color: #1b1c47;
        background: #faf7f2;
      }
      header {
        padding: 1rem 1.25rem 0.5rem;
        border-bottom: 1px solid #ece5db;
      }
      header h1 { margin: 0; font-size: 1.4rem; }
      header h1 a { color: inherit; text-decoration: none; }
      header p { margin: 0.25rem 0 0; color: #6b6b6b; font-size: 0.85rem; }
      /* Hide the gallery tagline while the editor route is open. */
      body:has(#editor-page:not([hidden])) header p { display: none; }
      main { padding: 0 1.25rem 2rem; }
      .category { margin-top: 1.5rem; }
      .category h2 {
        margin: 0 0 0.6rem;
        font-size: 0.95rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #568783;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 0.75rem;
      }
      .card {
        display: block;
        border: 1px solid #e3dccf;
        border-radius: 8px;
        overflow: hidden;
        background: #fff;
        color: inherit;
        text-decoration: none;
        transition: box-shadow 0.15s ease, transform 0.15s ease;
      }
      .card:hover, .card:focus {
        box-shadow: 0 6px 16px rgba(27, 28, 71, 0.18);
        transform: translateY(-2px);
        outline: none;
      }
      .card svg { display: block; width: 100%; height: auto; }
      .card .caption { padding: 0.45rem 0.55rem 0.6rem; font-size: 0.82rem; line-height: 1.25; }
      .card .caption .meta { margin-top: 0.15rem; color: #6b6b6b; font-size: 0.72rem; }
      #editor-page { padding: 0 1.25rem 2rem; }
      .back { display: inline-block; margin: 1rem 0 0.75rem; color: #568783; }
      .toolbar { display: flex; align-items: center; gap: 0.5rem; }
      .toolbar + .toolbar { margin-top: 0.4rem; }
      .toolbar label { width: 4.5rem; }
      .toolbar select { font: inherit; padding: 0.25rem 0.35rem; max-width: 34rem; }
      #editor { margin-top: 0.75rem; }
      footer { margin-top: 0.75rem; color: #6b6b6b; }
    </style>
  <link rel="modulepreload" href="/tir/tir-web-1f3f54296c1dc342.js" crossorigin="anonymous" integrity="sha384-db1vPHTVup+xbgw/zlq8HTKtILvK98hSNJ2Y+ii1S/7bZl7vCVFkXoR+5XuRoeX1"><link rel="preload" href="/tir/tir-web-1f3f54296c1dc342_bg.wasm" crossorigin="anonymous" integrity="sha384-n4PETRs3alZoxRYbBuLPSWjXLWDBjL0ouM329ebryBbIbAH2Y6WE8HwAfFfocVZA" as="fetch" type="application/wasm"></head>
  <body>
    <header>
      <h1><a href="#/">Tessellations</a></h1>
      <p>Pick a symmetry to start editing.</p>
    </header>

    <main id="gallery" aria-label="All tessellation symmetries"></main>

    <section id="editor-page" hidden>
      <a class="back" href="#/">&larr; All tessellations</a>
      <div class="toolbar">
        <label for="color-select">Colours</label>
        <select id="color-select"></select>
      </div>
      <div id="editor" style="width:400px; height:400px">
      </div>
      <footer>
        <small>&copy; Copyright 2023&ndash;2026, David Rasch</small> &nbsp;
        <a href="https://github.com/dcrasch/tir/">View Source code</a>
      </footer>
    </section>
  
<script type="module">
import init, * as bindings from '/tir/tir-web-1f3f54296c1dc342.js';
const wasm = await init({ module_or_path: '/tir/tir-web-1f3f54296c1dc342_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script><script>"use strict";

(function () {

    const address = '{{__TRUNK_ADDRESS__}}';
    const base = '{{__TRUNK_WS_BASE__}}';
    let protocol = '';
    protocol =
        protocol
            ? protocol
            : window.location.protocol === 'https:'
                ? 'wss'
                : 'ws';
    const url = protocol + '://' + address + base + '.well-known/trunk/ws';

    class Overlay {
        constructor() {
            // create an overlay
            this._overlay = document.createElement("div");
            const style = this._overlay.style;
            style.height = "100vh";
            style.width = "100vw";
            style.position = "fixed";
            style.top = "0";
            style.left = "0";
            style.backgroundColor = "rgba(222, 222, 222, 0.5)";
            style.fontFamily = "sans-serif";
            // not sure that's the right approach
            style.zIndex = "1000000";
            style.backdropFilter = "blur(1rem)";

            const container = document.createElement("div");
            // center it
            container.style.position = "absolute";
            container.style.top = "30%";
            container.style.left = "15%";
            container.style.maxWidth = "85%";

            this._title = document.createElement("div");
            this._title.innerText = "Build failure";
            this._title.style.paddingBottom = "2rem";
            this._title.style.fontSize = "2.5rem";

            this._message = document.createElement("div");
            this._message.style.whiteSpace = "pre-wrap";

            const icon= document.createElement("div");
            icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="#dc3545" viewBox="0 0 16 16"><path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg>';
            this._title.prepend(icon);

            container.append(this._title, this._message);
            this._overlay.append(container);

            this._inject();
            window.setInterval(() => {
                this._inject();
            }, 250);
        }

        set reason(reason) {
            this._message.textContent = reason;
        }

        _inject() {
            if (!this._overlay.isConnected) {
                // prepend it
                document.body?.prepend(this._overlay);
            }
        }

    }

    class Client {
        constructor(url) {
            this.url = url;
            this.poll_interval = 5000;
            this._overlay = null;
        }

        start() {
            const ws = new WebSocket(this.url);
            ws.onmessage = (ev) => {
                const msg = JSON.parse(ev.data);
                switch (msg.type) {
                    case "reload":
                        this.reload();
                        break;
                    case "buildFailure":
                        this.buildFailure(msg.data)
                        break;
                }
            };
            ws.onclose = () => this.onclose();
        }

        onclose() {
            window.setTimeout(
                () => {
                    // when we successfully reconnect, we'll force a
                    // reload (since we presumably lost connection to
                    // trunk due to it being killed, so it will have
                    // rebuilt on restart)
                    const ws = new WebSocket(this.url);
                    ws.onopen = () => window.location.reload();
                    ws.onclose = () => this.onclose();
                },
                this.poll_interval);
        }

        reload() {
            window.location.reload();
        }

        buildFailure({reason}) {
            // also log the console
            console.error("Build failed:", reason);

            console.debug("Overlay", this._overlay);

            if (!this._overlay) {
                this._overlay = new Overlay();
            }
            this._overlay.reason = reason;
        }
    }

    new Client(url).start();

})()
</script></body>
</html>
